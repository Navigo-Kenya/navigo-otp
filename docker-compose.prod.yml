# Production. Heap and memory limits come from /var/otp/.env (Compose reads
# it for ${…}); the defaults fit the 32 GB OVH server (budget in navigo-api's
# DEPLOYMENT.md §2): OTP serves with an 8 GB heap (Kenya with elevation needs
# about 4), and during a rebuild it is stopped, so the build can take 12 GB.
services:
  # ── OpenTripPlanner (serve) ───────────────────────────────────────────────
  otp:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: navigo-otp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=${OTP_JAVA_OPTS:--Xmx8G -Xms2G -XX:+UseG1GC}
    volumes:
      - /var/otp/graphs/default:/var/opentripplanner
    command: --load
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OTP_MEM_LIMIT:-10g}
    networks:
      - navigo_net

  # ── OpenTripPlanner (graph builder, on-demand) ────────────────────────────
  # The console's publish doesn't use this service: rebuild.sh starts a build
  # container from the running navigo-otp's image and folder (heap:
  # OTP_BUILD_JAVA_OPTS in the API's .env). Kept for manual builds.
  otp-build:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: navigo-otp-build
    profiles: ["build"]
    environment:
      - JAVA_TOOL_OPTIONS=${OTP_BUILD_JAVA_OPTS:--Xmx12G -Xms2G -XX:+UseG1GC}
    volumes:
      - /var/otp/graphs/default:/var/opentripplanner
    command: --build --save
    deploy:
      resources:
        limits:
          memory: ${OTP_BUILD_MEM_LIMIT:-14g}
    networks:
      - navigo_net


networks:
  navigo_net:
    name: navigo_net
    external: true
