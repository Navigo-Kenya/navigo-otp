services:
  # ── OpenTripPlanner (serve) ───────────────────────────────────────────────
  otp:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: navigo-otp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx4G -Xms512m -XX:+UseG1GC
    volumes:
      - ./graphs/default:/var/opentripplanner
    command: --load
    restart: unless-stopped
    networks:
      - navigo_net

  # ── OpenTripPlanner (graph builder, on-demand) ────────────────────────────
  otp-build:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: navigo-otp-build
    profiles: ["build"]
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx6G -Xms1G -XX:+UseG1GC
    volumes:
      - ./graphs/default:/var/opentripplanner
    command: --build --save
    networks:
      - navigo_net

  # ── Valhalla (car routing: alternatives, tolls, traffic-ready) ────────────
  # Builds its tiles from the same Kenya OSM extract on first start
  # (valhalla/*.pbf), then serves on :8002. Rebuild by deleting
  # valhalla/valhalla_tiles.tar.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    container_name: navigo-valhalla
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - build_admins=True
      - build_time_zones=True
      - build_elevation=False
      - build_transit=False
      - serve_tiles=True
      - server_threads=2
    volumes:
      - ./valhalla:/custom_files
    restart: unless-stopped
    networks:
      - navigo_net

networks:
  navigo_net:
    name: navigo_net
    external: true