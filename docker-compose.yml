services:
  # ── OpenTripPlanner (serve) ───────────────────────────────────────────────
  otp:
    image: opentripplanner/opentripplanner:2.4.0
    container_name: navigo-otp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx4G -Xms512m -XX:+UseG1GC
    volumes:
      - ./graphs/default:/var/opentripplanner
    command: --load
    restart: unless-stopped
    networks:
      - navigo_net

  # ── OpenTripPlanner (graph builder, on-demand) ────────────────────────────
  otp-build:
    image: opentripplanner/opentripplanner:2.4.0
    container_name: navigo-otp-build
    profiles: ["build"]
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx6G -Xms1G -XX:+UseG1GC
    volumes:
      - ./graphs/default:/var/opentripplanner
    command: --build --save
    networks:
      - navigo_net

networks:
  navigo_net:
    name: navigo_net
    external: true